# After a merge into main: rebuild the published single-file game at the repo root and commit it.
name: publish
on:
  push:
    branches: [main]
    paths: ['src/**', 'tools/build.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: python3 tools/build.py --check --publish
      - name: Commit the rebuilt game
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ผจญภัยไปกับ The Ascent.html"
          git commit -m "build: publish game from ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push
